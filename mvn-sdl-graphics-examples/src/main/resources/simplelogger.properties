# Configuración de slf4j-simple (los mensajes de log de los ejemplos).
# Niveles disponibles: trace, debug, info, warn, error, off.

# Nivel por defecto para todas las clases.
org.slf4j.simpleLogger.defaultLogLevel=info

# Nivel para las clases de los ejemplos (cámbielo a debug para ver más detalle).
org.slf4j.simpleLogger.log.com.juniverse.graphics.examples=info

# Formato de cada línea: fecha y hora, nombre corto de la clase, sin el nombre del hilo.
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true

# Los mensajes van a la salida estándar (System.out) en lugar de System.err.
org.slf4j.simpleLogger.logFile=System.out
