# slf4j-simple configuration (the log messages of the examples).
# Available levels: trace, debug, info, warn, error, off.

# Default level for all classes.
org.slf4j.simpleLogger.defaultLogLevel=info

# Level for the example classes (change it to debug for more detail).
org.slf4j.simpleLogger.log.com.juniverse.graphics.examples=info

# Format of each line: date and time, short class name, without the thread name.
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true

# Messages go to standard output (System.out) instead of System.err.
org.slf4j.simpleLogger.logFile=System.out
