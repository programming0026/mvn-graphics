# Integración continua: compila y prueba la biblioteca y los ejemplos en
# Windows, Linux y macOS, y publica los jars generados como artefactos.
#
# Las pruebas no abren ventanas (usan FakePlatform), por eso funcionan en los
# servidores de GitHub sin pantalla.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Cada sistema activa su perfil de nativos de LWJGL/SDL3 en los pom.xml.
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # La biblioteca se instala en ~/.m2 porque el proyecto de ejemplos la usa
      # como dependencia (incluido su test-jar con FakePlatform).
      - name: Build, test and install library
        working-directory: mvn-sdl-graphics
        run: mvn --batch-mode --no-transfer-progress clean install

      - name: Build and test examples
        working-directory: mvn-sdl-graphics-examples
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            mvn-sdl-graphics/target/surefire-reports/
            mvn-sdl-graphics-examples/target/surefire-reports/
          retention-days: 7

      # Los jars llevan los nativos de SDL3 del sistema donde se compilaron,
      # así que se publica uno por sistema operativo.
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: sdl-graphics-${{ matrix.os }}
          path: |
            mvn-sdl-graphics/target/*.jar
            mvn-sdl-graphics-examples/target/*-all.jar
          if-no-files-found: error
          retention-days: 14
